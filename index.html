<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadid Ahamed Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome or Icon Library -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="custom-cursor-dot"></div>
  <div class="custom-cursor-circle"></div>

  <!-- Navigation -->
  <nav class="main-nav">
    <button data-target="home">Home</button>
    <button data-target="profile">Profile</button>
    <button data-target="skills">Skills</button>
    <button data-target="projects">Projects</button>
    <button data-target="videos">Videos</button>
    <button data-target="contact">Contact</button>
    <button data-target="cv">CV</button>
  </nav>

  <!-- Sections -->
  <main>
    <section id="home" class="section visible">
      <!-- 3D Galaxy background canvas goes here -->
      <canvas id="galaxy-background"></canvas>
      <div class="home-content">
        <!-- Your home content here -->
      </div>
    </section>

    <section id="profile" class="section hidden">
      <!-- Profile content with image, bio, roll no, etc -->
    </section>

    <!-- Add other sections `skills`, `projects`, `videos`, `contact`, `cv` similarly -->
  </main>

  <!-- AI Assistant Floating Button -->
  <div class="ai-btn">🤖</div>

  <!-- AI Chatbox -->
  <div id="aiBox" class="hidden">
    <div class="ai-header">
      <span>Portfolio AI Assistant</span>
      <button class="close-btn">✕</button>
    </div>
    <div id="aiMessages"></div>
    <div id="aiInputContainer">
      <input type="text" id="aiInput" placeholder="Ask me anything... / বলুন..."/>
      <button id="voiceToggleBtn" title="Toggle Voice Mode">🎤</button>
    </div>
  </div>

  <script src="cursor.js"></script>
  <script src="voice.js"></script>
  <script src="3d-background.js"></script>
  <script src="ai.js"></script>
  <script src="navigation.js"></script>
</body>
</html>
